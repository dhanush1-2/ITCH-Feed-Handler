name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-release,    os: ubuntu-latest, cc: gcc,   cxx: g++,     preset: release }
          - { name: linux-clang-release,  os: ubuntu-latest, cc: clang, cxx: clang++, preset: release }
          - { name: linux-clang-asan,     os: ubuntu-latest, cc: clang, cxx: clang++, preset: asan }
          - { name: macos-clang-release,  os: macos-latest,  cc: clang, cxx: clang++, preset: release }
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install pytest
        run: python3 -m pip install --quiet --break-system-packages pytest

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --preset ${{ matrix.preset }} -G Ninja -DITCH_WARNINGS_AS_ERRORS=ON \
            -DITCH_REQUIRE_PYTEST=ON -DPython3_EXECUTABLE="$(command -v python3)"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset ${{ matrix.preset }} --timeout 300

      - name: Fetch script self-test
        if: matrix.preset == 'release' && matrix.os == 'ubuntu-latest' && matrix.cc == 'gcc'
        run: python3 scripts/fetch_itch.py --self-test

  verify-slice:
    name: verify-slice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build itch_replay
        run: |
          cmake --preset release -G Ninja -DITCH_BUILD_TESTS=OFF
          cmake --build --preset release --target itch_replay
      - name: Expand the slice
        run: python3 scripts/prepare_slice.py --out /tmp/slice.itch
      - name: Replay the real-data slice with every check on
        run: |
          build/release/tools/itch_replay /tmp/slice.itch --verify --full-check-every 1 \
            --symbols "$(cat testdata/slice_symbols.txt)" --export /tmp/slice_export.json \
            --pins results/expected_anomalies.json \
            --export-orders "$(cat testdata/slice_symbols.txt)" /tmp/slice_orders.json \
            | tee /tmp/replay.log
          grep -q VERIFIED /tmp/replay.log
      - name: Compare the export with the golden file
        run: python3 scripts/compare_export.py /tmp/slice_export.json testdata/expected_slice.json
      - name: Compare with the independent Python reference
        run: |
          python3 verify/reference_book.py /tmp/slice.itch \
            --symbols "$(cat testdata/slice_symbols.txt)" --json /tmp/slice_reference.json
          python3 verify/compare.py /tmp/slice_orders.json /tmp/slice_reference.json

  loss-injection:
    name: loss-injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and pytest
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          python3 -m pip install --quiet --break-system-packages pytest
      - name: Build
        run: |
          cmake --preset release -G Ninja -DITCH_WARNINGS_AS_ERRORS=ON -DITCH_REQUIRE_PYTEST=ON \
            -DPython3_EXECUTABLE="$(command -v python3)"
          cmake --build --preset release
      - name: Slice loss suite (receiver rig and mold_sim CLI tests)
        run: ctest --preset release -R 'slice_prepare|loss_injection|mold_sim_cli' --timeout 300
      - name: Loss sweep through the CLI, books compared with a direct replay
        # Five seeds at three loss levels. mold_sim exits 3 if the receiver goes Stale, the
        # delivered stream differs from the file's, or the noon books differ from a direct replay.
        run: |
          python3 scripts/prepare_slice.py --out /tmp/slice.itch
          for seed in 1 2 3 4 5; do
            for loss in 0.001 0.01 0.05; do
              build/release/tools/mold_sim /tmp/slice.itch --loss "$loss" --dup 0.005 --reorder 16 \
                --burst 0.0005,64 --retransmit-loss 0.01 --seed "$seed" \
                --dump-state /tmp/loss_state.bin --dump-at-s 43200 --check-direct
            done
          done

  tsan-snapshot:
    name: tsan-snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Build the tests with ThreadSanitizer
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset tsan -G Ninja -DITCH_BUILD_TOOLS=OFF -DITCH_BUILD_BENCH=OFF
          cmake --build --preset tsan --target itch_tests
      - name: Snapshot, pacer and view tests
        # The seqlock between the replay thread and the live view: one writer, a reader that
        # retries, no torn snapshot, and a reader that never blocks the writer.
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: build/tsan/tests/itch_tests --gtest_filter='Snapshot*:Pacer*:Tui*'

  fuzz-smoke:
    name: fuzz-60s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Build the fuzz targets
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DITCH_BUILD_FUZZ=ON -DITCH_BUILD_TESTS=OFF -DITCH_BUILD_TOOLS=OFF
          cmake --build build/fuzz --target fuzz_parser fuzz_mold
      - name: Fuzz for 60 seconds from the stored corpus
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p /tmp/work /tmp/art
          cp fuzz/corpus/* /tmp/work/
          build/fuzz/fuzz/fuzz_parser -max_total_time=60 -print_final_stats=1 \
            -artifact_prefix=/tmp/art/ /tmp/work
      - name: Fuzz the MoldUDP64 receiver for 60 seconds from its seed corpus
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p /tmp/work_mold /tmp/art
          cp fuzz/corpus_mold/* /tmp/work_mold/
          build/fuzz/fuzz/fuzz_mold -max_total_time=60 -print_final_stats=1 \
            -artifact_prefix=/tmp/art/ /tmp/work_mold
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: /tmp/art

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned via pip: different clang-format majors disagree about formatting.
      - run: python3 -m pip install --quiet --break-system-packages 'clang-format==20.1.7'
      - name: Check formatting
        run: |
          CF=$(python3 -c "import clang_format, os; print(os.path.join(os.path.dirname(clang_format.__file__), 'data', 'bin', 'clang-format'))")
          "$CF" --version
          find include tests tools fuzz -name '*.hpp' -o -name '*.cpp' | xargs "$CF" --dry-run --Werror
